name: Cypress E2E - Special Features
on:
  pull_request:
    branches:
      - '**'
permissions:
  contents: read

jobs:
  install:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [22.x]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}

      - name: Simorgh Build
        uses: cypress-io/github-action@v6
        with:
          runTests: false
          build: yarn build

      - name: Save Simorgh Build
        uses: actions/upload-artifact@v4
        with:
          name: simorgh-build
          if-no-files-found: error
          path: build

  cypress-run:
    runs-on: ubuntu-latest
    needs: install
    strategy:
      fail-fast: false
      matrix:
        node-version: [22.x]
        containers: [1, 2, 3, 4, 5]
    env:
      CI: true
      LOG_LEVEL: 'error'
      CYPRESS_SKIP_EU: true
      CYPRESS_SMOKE: true
      CYPRESS_APP_ENV: 'local'
      YARN_ENABLE_IMMUTABLE_INSTALLS: false

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}

      - name: Add bbc.com domain
        run: sudo echo "127.0.0.1 localhost.bbc.com" | sudo tee -a /etc/hosts

      - name: Download the Simorgh build folder
        uses: actions/download-artifact@v4
        with:
          name: simorgh-build
          path: build

      - name: List all files
        run: ls -a && cp envConfig/local.env .env

      - name: Run Simorgh E2Es (Special Features)
        uses: cypress-io/github-action@v6
        env:
          SPLIT: ${{ strategy.job-total }}
          SPLIT_INDEX: ${{ strategy.job-index }}
        with:
          install-command: yarn install
          start: yarn start
          command: yarn cypress:special-features
