name: Dependabot Code Review
on:
  pull_request:
    # types:
    #   - opened
    branches:
      - '**'

jobs:
  run:
    name: Request Code Review
    runs-on: ubuntu-latest
    steps:
      - name: Checkout the repo
        uses: actions/checkout@v4

      - name: Post Slack Message
        uses: slackapi/slack-github-action@v2.1.0
        with:
          webhook: ${{ secrets.SLACK_WEBHOOK_URL }}
          webhook-type: incoming-webhook
          payload: |
            "text": "Please review this Pull Request:"
            "attachments": [
              {
                "color": "#38146b"
                "title": "${{ github.event.pull_request.title }}"
                "title_link": "${{ github.event.pull_request.html_url }}"
                "fields": [
                  {
                    "value": "Repo: ${{ github.event.pull_request.head.repo.name }}\nAuthor: ${{ github.event.pull_request.user.login }}\nFiles changed: ${{ github.event.pull_request.changed_files }}"
                  }
                ]
              }
            ]
