name: Cypress E2E - Application
on:
  pull_request:
    types: [opened, synchronize, reopened, labeled]
    branches:
      - '**'
  merge_group:
permissions:
  contents: read

jobs:
  cypress-run:
    # E2Es only run in the merge queue, or on PRs with the 'run-e2e' label.
    if: github.event_name == 'merge_group' || contains(github.event.pull_request.labels.*.name, 'run-e2e')
    runs-on: ubuntu-latest
    strategy:
      matrix:
          node-version: ['24']
    env:
      CI: true
      LOG_LEVEL: 'error'
      CYPRESS_SKIP_EU: true
      CYPRESS_SMOKE: true
      CYPRESS_APP_ENV: 'local'

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v5
        with:
          node-version: ${{ matrix.node-version }}

      - name: Add bbc.com domain
        run: sudo echo "127.0.0.1 localhost.bbc.com" | sudo tee -a /etc/hosts

      - name: Install Cypress dependency (Next.js app)
        run: |
          chmod +x ./scripts/installCypress.sh
          ./scripts/installCypress.sh ws-nextjs-app

      - name: Install Cypress binary (Next.js app)
        working-directory: ws-nextjs-app
        run: yarn cypress:install

      - name: Run Simorgh NextJS E2Es
        uses: cypress-io/github-action@v7
        with:
          install: false
          working-directory: ws-nextjs-app
          build: yarn build
          start: yarn start
          command: yarn cypress:application

  # Required check for this workflow. Passes when the E2Es pass, or when they're skipped on a PR.
  e2e-result:
    name: Cypress Application E2E result
    needs: [cypress-run]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: E2Es failed or were cancelled
        if: >-
          contains(needs.*.result, 'failure') ||
          contains(needs.*.result, 'cancelled') ||
          (github.event_name == 'merge_group' && contains(needs.*.result, 'skipped'))
        run: exit 1
      - name: E2Es skipped
        if: contains(needs.*.result, 'skipped') && github.event_name != 'merge_group'
        run: echo "::notice::E2Es skipped on this PR. They run in the merge queue, or add the 'run-e2e' label to run them here."
