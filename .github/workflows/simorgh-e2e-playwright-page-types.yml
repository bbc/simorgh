name: Playwright E2E - Page Types
on:
  pull_request:
    types: [opened, synchronize, reopened, labeled]
    branches:
      - '**'
  merge_group:
permissions:
  contents: read

# E2Es only run in the merge queue, or on PRs with the 'run-e2e' label.
# The job itself always runs so its required check still reports on PRs.
env:
  RUN_E2E: ${{ github.event_name == 'merge_group' || contains(github.event.pull_request.labels.*.name, 'run-e2e') }}

jobs:
  playwright-run:
    runs-on: ubuntu-latest
    strategy:
      matrix:
          node-version: ['24']
    env:
      CI: true
      LOG_LEVEL: 'error'
      APP_ENV: 'local'

    steps:
      - name: E2Es skipped
        if: env.RUN_E2E != 'true'
        run: echo "::notice::E2Es skipped on this PR. They run in the merge queue, or add the 'run-e2e' label to run them here."

      - name: Checkout
        if: env.RUN_E2E == 'true'
        uses: actions/checkout@v7

      - name: Use Node.js ${{ matrix.node-version }}
        if: env.RUN_E2E == 'true'
        uses: actions/setup-node@v5
        with:
          node-version: ${{ matrix.node-version }}
          cache: yarn

      - name: Enable Corepack
        if: env.RUN_E2E == 'true'
        run: corepack enable

      - name: Install dependencies
        if: env.RUN_E2E == 'true'
        run: yarn install --immutable

      - name: Install Playwright browser
        if: env.RUN_E2E == 'true'
        working-directory: ws-nextjs-app
        run: npx playwright install --with-deps chromium

      - name: Build Simorgh NextJS app
        if: env.RUN_E2E == 'true'
        working-directory: ws-nextjs-app
        run: yarn build

      - name: Start Simorgh NextJS app and run Playwright tests
        if: env.RUN_E2E == 'true'
        working-directory: ws-nextjs-app
        run: |
          set -euo pipefail
          yarn start > /tmp/simorgh-nextjs.log 2>&1 &
          SERVER_PID=$!

          cleanup() {
            kill "$SERVER_PID" || true
          }
          trap cleanup EXIT

          if ! curl --retry 120 --retry-delay 1 --retry-all-errors \
              -fsS "http://127.0.0.1:7081/api/status" > /dev/null; then
            echo "Server failed to start"
            cat /tmp/simorgh-nextjs.log || true
            exit 1
          fi

          yarn playwright:e2e

      - name: Upload Playwright test artifacts
        if: always() && env.RUN_E2E == 'true'
        uses: actions/upload-artifact@v6
        with:
          name: playwright-error-page404-artifacts
          path: |
            ws-nextjs-app/playwright-report
            ws-nextjs-app/test-results
          if-no-files-found: ignore
