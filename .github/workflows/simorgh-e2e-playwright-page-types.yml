name: Playwright E2E - Page Types
on:
  pull_request:
    types: [opened, synchronize, reopened, labeled]
    branches:
      - '**'
  merge_group:
permissions:
  contents: read

jobs:
  playwright-run:
    # E2Es only run in the merge queue, or on PRs with the 'run-e2e' label.
    if: github.event_name == 'merge_group' || contains(github.event.pull_request.labels.*.name, 'run-e2e')
    runs-on: ubuntu-latest
    strategy:
      matrix:
          node-version: ['24']
    env:
      CI: true
      LOG_LEVEL: 'error'
      APP_ENV: 'local'

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v5
        with:
          node-version: ${{ matrix.node-version }}
          cache: yarn

      - name: Enable Corepack
        run: corepack enable

      - name: Install dependencies
        run: yarn install --immutable

      - name: Install Playwright browser
        working-directory: ws-nextjs-app
        run: npx playwright install --with-deps chromium

      - name: Build Simorgh NextJS app
        working-directory: ws-nextjs-app
        run: yarn build

      - name: Start Simorgh NextJS app and run Playwright tests
        working-directory: ws-nextjs-app
        run: |
          set -euo pipefail
          yarn start > /tmp/simorgh-nextjs.log 2>&1 &
          SERVER_PID=$!

          cleanup() {
            kill "$SERVER_PID" || true
          }
          trap cleanup EXIT

          if ! curl --retry 120 --retry-delay 1 --retry-all-errors \
              -fsS "http://127.0.0.1:7081/api/status" > /dev/null; then
            echo "Server failed to start"
            cat /tmp/simorgh-nextjs.log || true
            exit 1
          fi

          yarn playwright:e2e

      - name: Upload Playwright test artifacts
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: playwright-error-page404-artifacts
          path: |
            ws-nextjs-app/playwright-report
            ws-nextjs-app/test-results
          if-no-files-found: ignore

  # Required check for this workflow. Passes when the E2Es pass, or when they're skipped on a PR.
  e2e-result:
    name: Playwright Page Types E2E result
    needs: [playwright-run]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Check E2E result
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
          EVENT: ${{ github.event_name }}
        run: |
          echo "Job results: $RESULTS"
          for result in $RESULTS; do
            if [ "$result" = success ]; then continue; fi
            if [ "$result" = skipped ] && [ "$EVENT" != merge_group ]; then continue; fi
            echo "::error::E2Es did not pass ($result)."
            exit 1
          done
          case " $RESULTS " in
            *" skipped "*) echo "::notice::E2Es skipped on this PR. They run in the merge queue, or add the 'run-e2e' label to run them here." ;;
            *) echo "E2Es passed." ;;
          esac
