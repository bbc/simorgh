name: Cypress E2E - Page Types
on:
  pull_request:
    branches:
      - '**'
permissions:
  contents: read

jobs:
  build-matrix:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.generate-matrix.outputs.matrix }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Generate dynamic page-types shard matrix
        id: generate-matrix
        shell: bash
        run: |
          set -euo pipefail

          matrix=$(node <<'NODE'
          const { readFileSync, readdirSync, statSync } = require('fs');
          const { join } = require('path');

          const SHARD_COUNT = 6;
          const root = 'ws-nextjs-app/cypress/e2e/pageTypes';

          const nodeVersion = readFileSync('.nvmrc', 'utf8').trim();

          if (!nodeVersion) {
            throw new Error('Detected empty Node version in .nvmrc');
          }

          console.error(`Detected Node version from .nvmrc: ${nodeVersion}`);

          const walk = dir =>
            readdirSync(dir).flatMap(name => {
              const fullPath = join(dir, name);
              if (statSync(fullPath).isDirectory()) {
                return walk(fullPath);
              }
              return fullPath;
            });

          const specFiles = walk(root)
            .filter(file => file.endsWith('index.cy.ts'))
            .sort();

          if (!specFiles.length) {
            throw new Error('No page-types index.cy.ts files found.');
          }

          const shards = Array.from({ length: SHARD_COUNT }, () => []);

          specFiles.forEach((file, index) => {
            const shardIndex = index % SHARD_COUNT;
            shards[shardIndex].push(`./${file.replace('ws-nextjs-app/', '')}`);
          });

          const include = shards
            .map((specs, index) => ({ specs, index }))
            .filter(({ specs }) => specs.length > 0)
            .map(({ specs, index }) => ({
              'node-version': nodeVersion,
              'shard-name': `shard-${index + 1}`,
              specs: specs.join(','),
            }));

          process.stdout.write(JSON.stringify({ include }));
          NODE
          )

          {
            echo 'matrix<<EOF'
            echo "${matrix}"
            echo 'EOF'
          } >> "$GITHUB_OUTPUT"

  cypress-run:
    needs: build-matrix
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.build-matrix.outputs.matrix) }}
    env:
      CI: true
      LOG_LEVEL: 'error'
      CYPRESS_SKIP_EU: true
      CYPRESS_SMOKE: true
      CYPRESS_APP_ENV: 'local'

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Use Node.js ${{ matrix['node-version'] }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix['node-version'] }}

      - name: Add bbc.com domain
        run: sudo echo "127.0.0.1 localhost.bbc.com" | sudo tee -a /etc/hosts

      - name: Install Cypress dependency (Next.js app)
        run: |
          chmod +x ./scripts/installCypress.sh
          ./scripts/installCypress.sh ws-nextjs-app

      - name: Install Cypress binary (Next.js app)
        working-directory: ws-nextjs-app
        run: yarn cypress:install

      - name: Run Simorgh NextJS E2Es (${{ matrix['shard-name'] }})
        uses: cypress-io/github-action@v6
        with:
          install: false
          working-directory: ws-nextjs-app
          build: yarn build
          start: yarn start
          command: yarn exec cypress run --browser chrome --spec "${{ matrix.specs }}"

      - name: Upload Cypress reports (${{ matrix['shard-name'] }})
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cypress-page-types-reports-${{ matrix['shard-name'] }}
          path: ws-nextjs-app/cypress/results/*.xml
          if-no-files-found: ignore
