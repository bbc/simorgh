name: Simorgh CI - Unit Tests
on:
  pull_request:
    branches:
      - '**'
permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node-version: [22.x]
        containers: [1, 2, 3, 4]
    env:
      CI: true
      YARN_ENABLE_IMMUTABLE_INSTALLS: false

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}

      - name: Cache Node Modules
        id: cache
        uses: actions/cache@v4
        with:
          path: |
            node_modules
            ws-nextjs-app/node_modules
          key: node-modules-${{ hashFiles('yarn.lock', 'ws-nextjs-app/yarn.lock') }}

      - name: Install Node Modules
        if: steps.cache.outputs.cache-hit != 'true'
        run: ./scripts/installNodeModules.sh

      - name: Build Simorgh - Express App
        run: yarn build

      - name: Build Simorgh - Next.JS App
        if: ${{ strategy.job-index == 0 }}
        working-directory: ./ws-nextjs-app
        run: yarn build

      - name: Install Node Modules
        run: ./scripts/installNodeModules.sh

      - name: Unit Tests - Express App
        run: |
          export INDEX=$((${{ strategy.job-index }} + 1))
          yarn test:unit:ci --shard=$INDEX/${{ strategy.job-total }}

      - name: Unit Tests - Next.JS App
        if: ${{ strategy.job-index == 0 }}
        working-directory: ./ws-nextjs-app
        run: |
          yarn test
