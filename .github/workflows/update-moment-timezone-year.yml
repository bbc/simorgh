name: Update MomentTimezoneInclude Year
on:
  schedule:
    # 06:00 UTC on 1st December every year
    - cron: '0 6 1 12 *'
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  update-year:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [22.x]

    steps:
      - uses: actions/checkout@v4

      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}

      - name: Bump MomentTimezoneInclude endYear
        run: node scripts/updateMomentTimezoneYear.js

      - name: Create Pull Request
        uses: peter-evans/create-pull-request@v6
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          commit-message: 'chore: bump MomentTimezoneInclude endYear [copilot]'
          branch: chore/update-moment-timezone-year
          delete-branch: true
          title: 'chore: update MomentTimezoneInclude endYear'
          body: |
            Automated update of the `endYear` passed to `MomentTimezoneInclude`
            so the bundled moment-timezone data covers the upcoming year.

            Generated by the `Update MomentTimezoneInclude Year` workflow.
          labels: dependencies
