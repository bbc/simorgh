version: 2
updates:
  - package-ecosystem: 'npm'
    directory: '/'
    schedule:
      interval: 'weekly'
      day: 'wednesday'
      time: '16:00'
    ignore:
      # https://bbc.atlassian.net/browse/WS-106 - Replace `winston` logger because we currently have a workaround patch to fix a memory leak
      - dependency-name: 'winston'
      # https://jira.dev.bbc.co.uk/browse/NEWSWORLDSERVICE-2185: Latest version of eslint has breaking changes
      - dependency-name: eslint
        update-types: ['version-update:semver-major']
      - dependency-name: '@typescript-eslint/eslint-plugin'
        update-types: ['version-update:semver-major']
      # https://jira.dev.bbc.co.uk/browse/NEWSWORLDSERVICE-2164: Migrate all page types to Next.js + Lambda to remove Express + EC2 infrastructure
      - dependency-name: 'react-router-config'
      - dependency-name: 'react-router-dom'
      - dependency-name: 'express'
        update-types: ['version-update:semver-major']
    labels:
      - 'dependencies'
    groups:
      babel:
        patterns:
          - '@babel/*'
          - 'babel-*'
      bbc:
        patterns:
          - '@bbc/*'
      emotion:
        patterns:
          - '@emotion/*'
      next:
        patterns:
          - '@next/*'
          - 'next'
          - 'next-*'
          - '@img-sharp-*'
      loadable-minor-patch:
        patterns:
          - '@loadable/*'
      react:
        patterns:
          - 'react'
          - 'react-dom'
          - '@types/react'
          - '@types/react-dom'
      storybook:
        patterns:
          - '@storybook/*'
          - 'storybook'
          - '@esbuild/*'
      webpack-minor-patch:
        patterns:
          - 'webpack'
          - 'webpack-*'
